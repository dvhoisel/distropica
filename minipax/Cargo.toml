[package]
name = "minipax"
version = "0.1.0"
edition = "2021"
description = "O Ministério da Paz: materializa perfis e compõe mídias da Distrópica."
license = "GPL-3.0-or-later"
repository = "https://github.com/dvhoisel/distropica"

[dependencies]
anyhow = "1"
crc32fast = "1"
fatfs = "0.3.6"
hex = "0.4"
# termios entra pela TUI do instalador: modo cru sem crate nova. Ver src/tui.rs.
# mount entra pelo boot-update: a ESP do sistema instalado só é montada durante
# a rotação do EFI, pelo vfat do próprio kernel. Ver src/boot_update.rs.
rustix = { version = "1", features = ["fs", "termios", "mount"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"

[dev-dependencies]
