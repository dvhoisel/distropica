[package]
name = "minitrue"
version = "0.1.0"
edition = "2021"
description = "O Ministério da Verdade: busca, verifica, registra, apaga."
license = "GPL-3.0-or-later"
repository = "https://github.com/dvhoisel/distropica"

[dependencies]
anyhow = "1"
ed25519-dalek = "2"
fs2 = "0.4"
getrandom = "0.2"
hex = "0.4"
libc = "0.2"
minisign-verify = "0.2"
ruzstd = "0.8"
sha2 = "0.10"
tar = "0.4"
ureq = "2"
url = "2"

[dev-dependencies]
base64 = "0.22"
blake2 = "0.10"

[profile.release]
lto = true
strip = true
