[package]
name = "minitrue"
version = "0.1.0"
edition = "2021"
description = "O Ministério da Verdade: busca, verifica, registra, apaga."
license = "GPL-3.0-or-later"
repository = "https://github.com/dvhoisel/distropica"

[features]
# O binário distribuído é sempre construído sem features. TOFU é ferramenta de
# autoria, habilitada conscientemente por `bootstrap/build-minitrue.sh
# --authoring`; nunca pode reaparecer porque alguém acrescentou uma feature
# default para outro assunto.
default = []
tofu-authoring = []

[dependencies]
anyhow = "1"
base64 = "0.22"
blake2 = "0.10"
ed25519-dalek = { version = "2", features = ["zeroize"] }
getrandom = "0.2"
hex = "0.4"
libc = "0.2"
minisign-verify = "0.2"
ruzstd = "0.8"
scrypt = { path = "vendor-scrypt", version = "0.12", default-features = false }
sequoia-openpgp = { version = "=2.4.1", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }
sha2 = "0.10"
tar = "0.4"
ureq = "2"
url = "2"
zeroize = "1"

[profile.release]
lto = true
strip = true
# A reprodutibilidade ENTRE MÁQUINAS depende de remapear o caminho do fonte,
# que senão é embutido no binário — havia 139 ocorrências do caminho absoluto
# aqui dentro. Isso NÃO é feito por `trim-paths` porque a opção ainda não está
# estabilizada (cargo 1.94 recusa o manifesto inteiro); é feito por
# --remap-path-prefix em bootstrap/build-minitrue.sh, que é o único caminho
# suportado de construir este binário de forma verificável.
