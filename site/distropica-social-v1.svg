<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Distrópica — retificando o presente</title>
  <desc id="description">Cartão social da distribuição Linux Distrópica.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#10100f"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="48" y="48" width="1104" height="534" fill="#171714" fill-opacity="0.76" stroke="#34332e" stroke-width="2"/>

  <circle cx="78" cy="102" r="7" fill="#9bb77a"/>
  <text x="98" y="111" fill="#aaa397" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="22" font-weight="700" letter-spacing="1.4">DISTRIBUIÇÃO LINUX · x86_64 · UEFI</text>

  <text x="70" y="285" fill="#e7e1d5" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="124" font-weight="900" letter-spacing="-5">DISTRÓPICA</text>
  <text x="75" y="342" fill="#d4a557" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="30" font-weight="700" letter-spacing="2.7">RETIFICANDO O PRESENTE</text>

  <line x1="75" y1="390" x2="1125" y2="390" stroke="#34332e" stroke-width="2"/>

  <g font-family="Liberation Mono, DejaVu Sans Mono, monospace">
    <text x="75" y="442" fill="#df493f" font-size="20" font-weight="700">01</text>
    <text x="113" y="442" fill="#e7e1d5" font-size="24" font-weight="700">BINÁRIO UPSTREAM</text>

    <text x="391" y="442" fill="#aaa397" font-size="26">→</text>

    <text x="445" y="442" fill="#df493f" font-size="20" font-weight="700">02</text>
    <text x="483" y="442" fill="#e7e1d5" font-size="24" font-weight="700">CANAL DISTRÓPICA</text>

    <text x="790" y="442" fill="#aaa397" font-size="26">→</text>

    <text x="844" y="442" fill="#df493f" font-size="20" font-weight="700">03</text>
    <text x="882" y="442" fill="#e7e1d5" font-size="24" font-weight="700">FONTE</text>

    <text x="75" y="526" fill="#aaa397" font-size="21">NÃO INSTALA PACOTES. RETIFICA REGISTROS.</text>
    <text x="1125" y="526" fill="#e7e1d5" font-size="21" font-weight="700" text-anchor="end">DISTROPICA.COM.BR</text>
  </g>
</svg>
