server {
    listen 80;
    listen [::]:80;
    server_name distropica.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/distropica.com.br;
        try_files $uri =404;
    }

    location / {
        return 301 https://distropica.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name distropica.com.br;

    root /var/www/distropica.com.br;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/distropica.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/distropica.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    sendfile on;
    tcp_nopush on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /releases/ {
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ /\. {
        deny all;
    }
}
